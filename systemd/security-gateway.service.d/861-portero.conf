# security-gateway 0.4.0 · 861 (#871 A, #851 A) · parámetros NO secretos.
# Los secretos siguen en /etc/security-gateway/.env (EnvironmentFile).
[Service]
# Credencial de consumidor: transición hasta la fecha; después, 401 sin token.
Environment=SG_AUTH_MODE=transicion
Environment=SG_AUTH_TRANSITION_UNTIL=2026-12-16
Environment=SG_CONSUMERS_FILE=/etc/security-gateway/consumers.tokens
# ClamAV obligatorio: sin antivirus no hay «pass».
Environment=SG_REQUIRE_CLAMAV=1
Environment=SG_CLAMD_SOCKET=/var/run/clamav/clamd.ctl
# Clasificador (#876 A): corre SIEMPRE y registra la puntuación, pero sólo decide con el
# regex (sombra). Con `siempre` PG2-86M mandó a cuarentena 3/5 textos limpios ES (16-nov).
Environment=SG_CLASIFICADOR_MODO=sombra
# Tope de ventanas (cabeza+cola) y hilos para no ahogar la CPU.
Environment=SG_PG_MAX_WINDOWS=8
Environment=SG_PG_BATCH_SIZE=2
Environment=SG_TORCH_THREADS=4
# LlamaGuard: cableado, APAGADO en el despliegue. Medido 15-nov-2026: +1,8 GB de RAM en
# Ollama (swap llena), 4-27 s por llamada y en sombra multiplica x5-10 la latencia del
# clasificador por competir por CPU; además marcó unsafe 3/3 correos de negocio en
# español. Encenderlo (sombra|bloquear) es decisión del SAdmin con estos datos.
Environment=SG_LLAMAGUARD_MODE=off
